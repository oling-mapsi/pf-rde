monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - audit
        - interop_sig

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            audit:
                type: stream
                path: "%kernel.logs_dir%/audit.log"
                level: info
                channels: ["audit"]
            interop_sig:
                type: stream
                path: "%kernel.logs_dir%/interop_sig.log"
                level: info
                channels: ["interop_sig"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            audit:
                type: stream
                path: "%kernel.logs_dir%/audit_test.log"
                level: info
                channels: ["audit"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            audit:
                type: stream
                channels: [audit]
                path: php://stderr
                formatter: monolog.formatter.json
            interop_sig:
                type: stream
                channels: [interop_sig]
                path: php://stderr
                formatter: monolog.formatter.json
