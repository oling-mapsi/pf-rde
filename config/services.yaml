# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(APP_SSO_O365_ENABLED): 'false'
    env(APP_SSO_O365_TENANT_ID): ''
    env(APP_SSO_O365_CLIENT_ID): ''
    env(APP_SSO_O365_CLIENT_SECRET): ''
    env(APP_SSO_O365_SCOPE): 'openid profile email'
    env(APP_SSO_O365_ROLE_CLAIM): 'roles'
    env(APP_SSO_O365_ROLE_MAP): '{"SIG_ADMIN":"ROLE_ADMIN","SIG_MANAGER":"ROLE_MANAGER","SIG_AGENT":"ROLE_AGENT"}'
    env(APP_SSO_O365_DEFAULT_INTERNAL_ROLE): 'ROLE_AGENT'
    env(APP_SSO_O365_ALLOWED_TENANT_IDS): '[]'
    env(APP_SSO_O365_REQUIRE_ROLE_CLAIM): 'true'
    env(APP_SSO_O365_ALLOW_DEFAULT_ROLE_FALLBACK): 'false'
    env(APP_SSO_O365_DENY_IF_UNMAPPED_ROLES): 'true'
    env(APP_SSO_O365_VERBOSE_USER_ERRORS): 'true'
    env(APP_GOD_MODE_EMAIL): 'florestan.rouet@oling.fr'
    env(APP_SIRENE_ENABLED): 'true'
    env(APP_SIRENE_API_TOKEN): ''
    env(APP_SIRENE_SIRET_ENDPOINT_TEMPLATE): 'https://api.insee.fr/entreprises/sirene/V3.11/siret/{siret}'
    env(APP_SIRENE_TIMEOUT_SECONDS): '8'
    env(APP_REGISTRATION_FROM_EMAIL): 'no-reply@routes-guadeloupe.local'
    app.security.password_min_length: '%env(int:APP_SECURITY_PASSWORD_MIN_LENGTH)%'
    app.cookie_consent.enabled: '%env(bool:APP_COOKIE_CONSENT_ENABLED)%'
    app.file_upload.max_size_mb: '%env(int:APP_UPLOAD_MAX_SIZE_MB)%'
    app.matomo.enabled: '%env(bool:APP_MATOMO_ENABLED)%'
    app.matomo.site_id: '%env(int:APP_MATOMO_SITE_ID)%'
    app.matomo.base_url: '%env(string:APP_MATOMO_BASE_URL)%'
    app.sso.o365.enabled: '%env(bool:APP_SSO_O365_ENABLED)%'
    app.sso.o365.tenant_id: '%env(string:APP_SSO_O365_TENANT_ID)%'
    app.sso.o365.client_id: '%env(string:APP_SSO_O365_CLIENT_ID)%'
    app.sso.o365.client_secret: '%env(string:APP_SSO_O365_CLIENT_SECRET)%'
    app.sso.o365.scope: '%env(string:APP_SSO_O365_SCOPE)%'
    app.sso.o365.role_claim: '%env(string:APP_SSO_O365_ROLE_CLAIM)%'
    app.sso.o365.role_map: '%env(json:APP_SSO_O365_ROLE_MAP)%'
    app.sso.o365.default_internal_role: '%env(string:APP_SSO_O365_DEFAULT_INTERNAL_ROLE)%'
    app.sso.o365.allowed_tenant_ids: '%env(json:APP_SSO_O365_ALLOWED_TENANT_IDS)%'
    app.sso.o365.require_role_claim: '%env(bool:APP_SSO_O365_REQUIRE_ROLE_CLAIM)%'
    app.sso.o365.allow_default_role_fallback: '%env(bool:APP_SSO_O365_ALLOW_DEFAULT_ROLE_FALLBACK)%'
    app.sso.o365.deny_if_unmapped_roles: '%env(bool:APP_SSO_O365_DENY_IF_UNMAPPED_ROLES)%'
    app.sso.o365.verbose_user_errors: '%env(bool:APP_SSO_O365_VERBOSE_USER_ERRORS)%'
    app.god_mode.email: '%env(string:APP_GOD_MODE_EMAIL)%'
    app.sirene.enabled: '%env(bool:APP_SIRENE_ENABLED)%'
    app.sirene.api_token: '%env(string:APP_SIRENE_API_TOKEN)%'
    app.sirene.siret_endpoint_template: '%env(string:APP_SIRENE_SIRET_ENDPOINT_TEMPLATE)%'
    app.sirene.timeout_seconds: '%env(float:APP_SIRENE_TIMEOUT_SECONDS)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Application\Interop\Sig\MapServiceProviderInterface: '@App\Infrastructure\Interop\Sig\Provider\MockMapServiceProvider'

    App\Application\Access\Sso\SsoRoleMapper:
        arguments:
            $roleMap: '%app.sso.o365.role_map%'
            $defaultInternalRole: '%app.sso.o365.default_internal_role%'
            $allowDefaultFallback: '%app.sso.o365.allow_default_role_fallback%'

    App\Application\Access\Sso\Office365OidcClient:
        arguments:
            $tenantId: '%app.sso.o365.tenant_id%'
            $clientId: '%app.sso.o365.client_id%'
            $clientSecret: '%app.sso.o365.client_secret%'
            $scope: '%app.sso.o365.scope%'
            $roleClaim: '%app.sso.o365.role_claim%'
            $enabled: '%app.sso.o365.enabled%'
            $requireRoleClaim: '%app.sso.o365.require_role_claim%'
            $allowedTenantIds: '%app.sso.o365.allowed_tenant_ids%'

    App\Application\Access\Service\GodModeService:
        arguments:
            $godModeEmail: '%app.god_mode.email%'

    App\Application\Access\Service\SireneSiretVerifier:
        arguments:
            $enabled: '%app.sirene.enabled%'
            $endpointTemplate: '%app.sirene.siret_endpoint_template%'
            $apiToken: '%app.sirene.api_token%'
            $timeoutSeconds: '%app.sirene.timeout_seconds%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
